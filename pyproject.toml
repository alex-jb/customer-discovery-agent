[project]
name = "customer-discovery-agent"
version = "0.5.0"
description = "Scan online communities (Reddit, +) for maker pain points; cluster into a weekly digest."
authors = [{ name = "Alex Ji", email = "alex@vibexforge.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9,<3",
    "praw>=7.7",
    "anthropic>=0.40",
    "solo-founder-os>=0.5.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
keywords = ["reddit", "scraper", "customer-discovery", "claude", "clustering", "indie"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "mcp>=1.0",
]

[project.scripts]
customer-discovery-agent = "customer_discovery_agent.__main__:main"
customer-discovery-mcp = "customer_discovery_agent.mcp_server:main"

[project.urls]
Homepage = "https://github.com/alex-jb/customer-discovery-agent"
Repository = "https://github.com/alex-jb/customer-discovery-agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["customer_discovery_agent*"]
exclude = ["tests*", "examples*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line-length: docstrings + log messages run long; not a bug
    "E731",  # lambda-assignment: idiomatic in tests
    "E402",  # module-level import not at top: __future__ + sys.path tricks
    "E702",  # multiple-statements-on-one-line: idiomatic in test fixtures
    "E741",  # ambiguous-variable-name: short loop vars are fine in context
]
