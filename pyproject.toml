[project]
name = "customer-discovery-agent"
version = "0.3.0"
description = "Scan online communities (Reddit, +) for maker pain points; cluster into a weekly digest."
authors = [{ name = "Alex Ji", email = "alex@vibexforge.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9,<3",
    "praw>=7.7",
    "anthropic>=0.40",
    "solo-founder-os>=0.5.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
keywords = ["reddit", "scraper", "customer-discovery", "claude", "clustering", "indie"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
]

[project.scripts]
customer-discovery-agent = "customer_discovery_agent.__main__:main"

[project.urls]
Homepage = "https://github.com/alex-jb/customer-discovery-agent"
Repository = "https://github.com/alex-jb/customer-discovery-agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["customer_discovery_agent*"]
exclude = ["tests*", "examples*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
